[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellstr"
version = "0.2.0"
description = "Display-width aware len, slice, pad and truncate for terminal text: wide CJK, emoji sequences, combining marks and ANSI codes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE-UNICODE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["ansi", "terminal", "width", "wcwidth", "unicode", "east-asian-width", "grapheme", "emoji", "truncate", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Terminals",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
cellstr = "cellstr._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine", "wcwidth==0.2.13"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/cellstr"
Issues = "https://github.com/JaviLianes8/cellstr/issues"
Changelog = "https://github.com/JaviLianes8/cellstr/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/cellstr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Width tests use look-alike characters (Greek, Cyrillic, fullwidth) on purpose.
"tests/*" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["e2e: builds the wheel; needs network access for the build backend"]
